  <rect width="1200" height="820" fill="url(#bgGrad)" rx="16" />
  <rect x="2" y="2" width="1196" height="816" fill="none" stroke="#1e293b" stroke-width="2" rx="14" />

  <text x="600" y="46" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="0.5">TRIT High-Performance Architecture Overview</text>
  <text x="600" y="70" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="500" fill="#94a3b8">1.5M Scale Social Feed &amp; Write-Behind Burstable Architecture</text>

  <rect x="40" y="110" width="180" height="420" rx="12" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-dasharray="4 4" />
  <text x="130" y="136" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8">CLIENT TIER</text>

