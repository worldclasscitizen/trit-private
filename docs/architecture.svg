    <text x="18" y="28" font-family="sans-serif" font-size="15" font-weight="800" fill="#fb7185">Redis 7.4 (Standalone)</text>
    <text x="18" y="48" font-family="sans-serif" font-size="11" fill="#cbd5e1">1) Feed Timelines: Sorted Sets (ZSet)</text>
    <text x="230" y="48" font-family="sans-serif" font-size="11" fill="#94a3b8">timeline:{userId} (Push)</text>
    <text x="18" y="68" font-family="sans-serif" font-size="11" fill="#cbd5e1">2) Like Write-Behind: liked_users:{logId}</text>
    <text x="230" y="68" font-family="sans-serif" font-size="11" fill="#94a3b8">3-second async flush to MySQL</text>
    <text x="18" y="88" font-family="sans-serif" font-size="11" fill="#cbd5e1">3) Token Blacklist: blacklist:{token}</text>
    <text x="365" y="88" font-family="sans-serif" font-size="11" font-weight="600" fill="#f43f5e">Port: 6379</text>
  </g>

  <g transform="translate(680, 295)" filter="url(#cardShadow)">
