    <rect x="365" y="10" width="85" height="20" rx="4" fill="#0284c7" />
    <text x="407" y="24" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff">🐳 DOCKER</text>

    <text x="18" y="28" font-family="sans-serif" font-size="15" font-weight="800" fill="#2dd4bf">Memcached (XMemcached)</text>
    <text x="18" y="48" font-family="sans-serif" font-size="11" fill="#cbd5e1">Feed Post Entity Hydration Cache</text>
    <text x="18" y="66" font-family="sans-serif" font-size="11" fill="#94a3b8">Key: post:entity:{id} | Binary Protocol, Multi-threaded</text>
    <text x="18" y="84" font-family="sans-serif" font-size="10" font-weight="600" fill="#5eead4">Offloads MySQL Read Load to 0 During Feed Scroll</text>
    <text x="365" y="84" font-family="sans-serif" font-size="11" font-weight="600" fill="#2dd4bf">Port: 21211</text>
